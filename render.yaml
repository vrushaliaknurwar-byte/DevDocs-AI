databases:
  - name: devdocs-db
    databaseName: devdocs
    user: devdocs
    plan: free
    region: singapore

services:
  - type: web
    name: devdocs-ai
    runtime: docker
    plan: free
    region: singapore
    healthCheckPath: /health
    dockerfilePath: ./Dockerfile
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: devdocs-db
          property: connectionString
      - key: GEMINI_API_KEY
        sync: false
      - key: EMBEDDING_MODEL
        value: gemini-embedding-001
      - key: GENERATION_MODEL
        value: gemini-3.5-flash
      - key: EMBEDDING_DIMENSIONS
        value: "768"
      - key: APP_ENV
        value: production
