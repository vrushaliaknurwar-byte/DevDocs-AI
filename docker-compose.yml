services:
  db:
    image: pgvector/pgvector:pg16
    container_name: devdocs_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-devdocs}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devdocs_password}
      POSTGRES_DB: ${POSTGRES_DB:-devdocs}
    ports:
      - "5432:5432"
    volumes:
      - devdocs_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-devdocs} -d ${POSTGRES_DB:-devdocs}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: devdocs_api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-devdocs}:${POSTGRES_PASSWORD:-devdocs_password}@db:5432/${POSTGRES_DB:-devdocs}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-gemini-embedding-001}
      GENERATION_MODEL: ${GENERATION_MODEL:-gemini-3.5-flash}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-768}
      APP_ENV: ${APP_ENV:-development}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app

volumes:
  devdocs_pgdata:
